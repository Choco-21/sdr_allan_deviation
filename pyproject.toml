[project]
name = "sdr-allan-deviation"
version = "0.1.0"
description = "IQ Allan deviation analysis"
requires-python = ">=3.12"
dependencies = [
    "allantools",
    "matplotlib",
    "numpy",
    "scipy",
    "soundfile",
]

[project.scripts]
main = "sdr_allan_deviation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdr_allan_deviation"]
exclude = ["**/*.wav"]
